<!doctype html>
<html dir="ltr" lang="en-US" class="relative h-full antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0052FF" />

    <meta name="color-scheme" content="light dark" />

    <script>
      // Theme: applied before the first paint to avoid a flash of the wrong theme.
      // 'light' / 'dark' come from the toggle in the header and are remembered on this device;
      // without a saved choice the site follows the system setting, live.
      ;(function () {
        var KEY = 'theme-preference'
        var root = document.documentElement
        var media = window.matchMedia('(prefers-color-scheme: dark)')

        function saved() {
          try {
            var value = localStorage.getItem(KEY)
            return value === 'light' || value === 'dark' ? value : null
          } catch (e) {
            // Storage can be blocked (private mode, strict privacy settings)
            return null
          }
        }

        function apply() {
          var theme = saved() || (media.matches ? 'dark' : 'light')
          root.classList.toggle('dark', theme === 'dark')
          root.setAttribute('data-theme', theme)
        }

        apply()

        // The system setting changed (only matters while no choice is saved)
        media.addEventListener('change', apply)
        // The choice was changed or cleared in another tab
        window.addEventListener('storage', function (e) {
          if (e.key === KEY || e.key === null) apply()
        })
      })()
    </script>
    <!-- Favicon — place favicon.ico in static/ -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover" class="bg-white dark:bg-gray-950">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
