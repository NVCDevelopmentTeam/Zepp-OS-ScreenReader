<!doctype html>
<html dir="ltr" lang="en-US" class="relative h-full antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0052FF" />

    <link rel="preconnect" href="https://pagead2.googlesyndication.com" />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <script>
      ;(function () {
        try {
          const STORAGE_KEY = 'theme-preference'

          // 1. Get cached theme (localStorage)
          let theme = localStorage.getItem(STORAGE_KEY)

          // 2. Fallback to system preference if not set
          if (!theme || theme === 'auto') {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
            theme = prefersDark ? 'dark' : 'light'
          }

          // 3. Apply immediately to avoid FOUC (Flash of Unstyled Content)
          const root = document.documentElement

          // UnoCSS: use "dark" class
          if (theme === 'dark') {
            root.classList.add('dark')
          } else {
            root.classList.remove('dark')
          }

          // optional: data attribute (if using additional CSS vars)
          root.setAttribute('data-theme', theme)

          // 4. Cache back (ensure sync)
          localStorage.setItem(STORAGE_KEY, theme)

          // 5. Sync between tabs (cache layer)
          window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
              const newTheme = e.newValue
              if (newTheme === 'dark') {
                root.classList.add('dark')
              } else {
                root.classList.remove('dark')
              }
              root.setAttribute('data-theme', newTheme)
            }
          })

          // 6. Defer non-critical logic
          setTimeout(() => {
            // example: fetch theme config from API or analytics
            // fetch('/api/theme-sync')

            // optional: re-check system change if set to auto
            const media = window.matchMedia('(prefers-color-scheme: dark)')
            media.addEventListener('change', (e) => {
              if (localStorage.getItem(STORAGE_KEY) === 'auto') {
                const newTheme = e.matches ? 'dark' : 'light'
                root.classList.toggle('dark', newTheme === 'dark')
                root.setAttribute('data-theme', newTheme)
              }
            })
          }, 0) // defer after initial paint
        } catch (e) {
          console.warn('theme init error', e)
        }
      })()
    </script>
    <!-- Favicon — place favicon.ico in static/ -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    %sveltekit.head%
  </head>

  <body
    data-sveltekit-preload-data="hover"
    data-sveltekit-preload-code="eager"
    class="bg-white dark:bg-gray-950"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
